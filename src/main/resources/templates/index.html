<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <title>DocumentGPT — Upload</title>
  <link rel="stylesheet" href="/css/style.css?v=2">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    // Apply saved theme before render to prevent flash
    (function () {
      if (localStorage.getItem("theme") === "light") document.documentElement.classList.add("light-mode");
    })();
  </script>
</head>

<body>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Theme Toggle -->
  <button class="icon-btn theme-toggle-fixed" id="theme-toggle" title="Toggle theme">
    <span class="material-symbols-rounded">light_mode</span>
  </button>

  <!-- Upload Page -->
  <div class="upload-page">

    <!-- Header -->
    <div class="upload-header">
      <img src="/images/spring-ai-logo.png" alt="DocumentGPT Logo" class="upload-logo">
      <h1>DocumentGPT</h1>
      <p class="upload-subtitle">Powered by Spring AI &amp; pgvector RAG</p>
    </div>

    <!-- Drop Zone -->
    <div class="drop-zone" id="drop-zone">
      <input type="file" id="fileToUpload" name="fileToUpload" accept=".pdf,application/pdf" style="display:none;"
        required>

      <!-- Default State -->
      <div class="drop-zone-content" id="drop-zone-content">
        <span class="material-symbols-rounded drop-icon">cloud_upload</span>
        <p class="drop-title">Drag &amp; drop your PDF here</p>
        <p class="drop-subtitle">or <span class="link-text">click to browse</span></p>
        <p class="drop-hint">
          <span class="material-symbols-rounded" style="font-size:0.95rem;vertical-align:middle">picture_as_pdf</span>
          PDF only &nbsp;•&nbsp; Max 10 MB
        </p>
      </div>

      <!-- File Selected State -->
      <div class="file-selected-info" id="file-selected-info" style="display:none;">
        <span class="material-symbols-rounded pdf-icon">picture_as_pdf</span>
        <div class="file-meta">
          <p id="selected-file-name" class="selected-name">—</p>
          <p id="selected-file-size" class="selected-size">—</p>
        </div>
        <button type="button" class="icon-btn remove-file-btn" id="remove-file-btn" title="Remove">
          <span class="material-symbols-rounded">close</span>
        </button>
      </div>
    </div>

    <!-- Progress -->
    <div class="progress-wrapper" id="progress-wrapper" style="display:none;">
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progress-bar-fill"></div>
      </div>
      <p class="progress-label" id="progress-label">Uploading… 0%</p>
    </div>

    <!-- Upload Button -->
    <button id="upload-btn" class="upload-action-btn" disabled>
      <span class="material-symbols-rounded">upload</span>
      Upload Document
    </button>

    <p class="already-uploaded">
      Already uploaded? <a href="/chat">Go to chat →</a>
    </p>

  </div><!-- /upload-page -->

  <script>
    // ── Theme ──────────────────────────────────────────────────────────────
    const themeToggle = document.getElementById("theme-toggle");
    function applyTheme() {
      themeToggle.querySelector(".material-symbols-rounded").textContent =
        (localStorage.getItem("theme") === "light") ? "dark_mode" : "light_mode";
    }
    themeToggle.addEventListener("click", () => {
      document.body.classList.toggle("light-mode");
      const t = document.body.classList.contains("light-mode") ? "light" : "dark";
      localStorage.setItem("theme", t);
      applyTheme();
    });
    if (localStorage.getItem("theme") === "light") document.body.classList.add("light-mode");
    applyTheme();

    // ── Toast ──────────────────────────────────────────────────────────────
    const toastContainer = document.getElementById("toast-container");
    function showToast(msg, type = "info") {
      const icons = { success: "check_circle", error: "error", warning: "warning", info: "info" };
      const t = document.createElement("div");
      t.className = `toast toast-${type}`;
      t.innerHTML = `<span class="material-symbols-rounded toast-icon">${icons[type] || "info"}</span><span>${msg}</span>`;
      toastContainer.appendChild(t);
      requestAnimationFrame(() => t.classList.add("show"));
      setTimeout(() => { t.classList.remove("show"); setTimeout(() => t.remove(), 350); }, 3800);
    }

    // ── File Helpers ───────────────────────────────────────────────────────
    function formatSize(bytes) {
      if (bytes < 1024) return bytes + " B";
      if (bytes < 1048576) return (bytes / 1024).toFixed(1) + " KB";
      return (bytes / 1048576).toFixed(1) + " MB";
    }

    // ── DOM refs ───────────────────────────────────────────────────────────
    const dropZone = document.getElementById("drop-zone");
    const fileInput = document.getElementById("fileToUpload");
    const dropContent = document.getElementById("drop-zone-content");
    const fileInfo = document.getElementById("file-selected-info");
    const fileNameEl = document.getElementById("selected-file-name");
    const fileSizeEl = document.getElementById("selected-file-size");
    const removeBtn = document.getElementById("remove-file-btn");
    const uploadBtn = document.getElementById("upload-btn");
    const progressWrap = document.getElementById("progress-wrapper");
    const progressFill = document.getElementById("progress-bar-fill");
    const progressLabel = document.getElementById("progress-label");
    let selectedFile = null;

    // ── File selection ─────────────────────────────────────────────────────
    function setFile(file) {
      if (!file) return;
      if (!file.type.includes("pdf")) { showToast("Only PDF files are supported.", "error"); return; }
      if (file.size > 10 * 1024 * 1024) { showToast("File exceeds 10 MB limit.", "warning"); return; }
      selectedFile = file;
      fileNameEl.textContent = file.name;
      fileSizeEl.textContent = formatSize(file.size);
      dropContent.style.display = "none";
      fileInfo.style.display = "flex";
      uploadBtn.disabled = false;
    }

    function clearFile() {
      selectedFile = null;
      fileInput.value = "";
      dropContent.style.display = "flex";
      fileInfo.style.display = "none";
      uploadBtn.disabled = true;
    }

    // ── Drop zone interactions ─────────────────────────────────────────────
    dropZone.addEventListener("click", e => {
      if (!e.target.closest("#remove-file-btn")) fileInput.click();
    });
    dropZone.addEventListener("dragover", e => { e.preventDefault(); dropZone.classList.add("drag-over"); });
    dropZone.addEventListener("dragleave", () => dropZone.classList.remove("drag-over"));
    dropZone.addEventListener("drop", e => {
      e.preventDefault();
      dropZone.classList.remove("drag-over");
      if (e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener("change", () => { if (fileInput.files[0]) setFile(fileInput.files[0]); });
    removeBtn.addEventListener("click", e => { e.stopPropagation(); clearFile(); });

    // ── Upload with XHR + progress ─────────────────────────────────────────
    uploadBtn.addEventListener("click", () => {
      if (!selectedFile) return;

      const formData = new FormData();
      formData.append("fileToUpload", selectedFile);

      const xhr = new XMLHttpRequest();

      xhr.upload.addEventListener("progress", e => {
        if (e.lengthComputable) {
          const pct = Math.round((e.loaded / e.total) * 100);
          progressFill.style.width = pct + "%";
          progressLabel.textContent = `Uploading… ${pct}%`;
        }
      });

      xhr.addEventListener("load", () => {
        try {
          const data = JSON.parse(xhr.responseText);
          if (data.success) {
            progressFill.style.width = "100%";
            progressLabel.textContent = "✔ Processing complete! Redirecting…";
            sessionStorage.setItem("documentInfo", JSON.stringify({
              documentId: data.documentId,
              filename: data.filename,
              size: data.size,
              uploadTime: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
            }));
            showToast("Document uploaded successfully!", "success");
            setTimeout(() => window.location.href = "/chat", 1200);
          } else {
            progressWrap.style.display = "none";
            uploadBtn.disabled = false;
            showToast(data.error || "Upload failed. Please try again.", "error");
          }
        } catch (_) {
          progressWrap.style.display = "none";
          uploadBtn.disabled = false;
          showToast("Unexpected server response.", "error");
        }
      });

      xhr.addEventListener("error", () => {
        progressWrap.style.display = "none";
        uploadBtn.disabled = false;
        showToast("Network error. Please try again.", "error");
      });

      xhr.open("POST", "/upload");
      xhr.setRequestHeader("X-Requested-With", "XMLHttpRequest");
      xhr.send(formData);

      progressWrap.style.display = "block";
      progressFill.style.width = "0%";
      progressLabel.textContent = "Uploading… 0%";
      uploadBtn.disabled = true;
    });
  </script>

</body>

</html>
